<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuorvexaTech | Web Development & Digital Solutions</title>
    <meta
      name="description"
      content="QuorvexaTech builds responsive business websites, online stores, landing pages and custom React.js sites with WordPress, Shopify and modern web tools."
    />
    <meta name="theme-color" content="#0f1b3d" />
    <link rel="canonical" href="https://quorvexatech.com/" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuorvexaTech" />
    <meta property="og:title" content="QuorvexaTech | Web Development & Digital Solutions" />
    <meta
      property="og:description"
      content="We Build Digital Experiences That Grow Your Business."
    />
    <meta property="og:url" content="https://quorvexatech.com/" />
    <meta property="og:image" content="https://quorvexatech.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QuorvexaTech Web Solutions logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://quorvexatech.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "QuorvexaTech",
        "url": "https://quorvexatech.com",
        "logo": "https://quorvexatech.com/logo-512.png",
        "description": "QuorvexaTech is a web development studio building responsive business websites, online stores, landing pages and custom React.js sites."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Netlify Forms detection: Netlify reads this static form at deploy time so it knows
      the form exists and which fields it has. The real form is the React ContactForm,
      which posts to "/" with form-name=contact. Field names MUST match ContactForm.jsx.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="service" />
      <textarea name="description"></textarea>
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
